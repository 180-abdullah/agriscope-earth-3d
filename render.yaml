services:
  - type: web
    name: agriscope-earth-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: CORS_ORIGINS
        sync: false
      - key: FIRMS_MAP_KEY
        sync: false
      - key: SENTINEL_MAX_SAMPLE_HECTARES
        value: "2500"
